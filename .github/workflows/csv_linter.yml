name: CSV Linter and Trailing Whitespaces

on:
  push:
  pull_request:

jobs:
  lint_and_check_trailing_whitespaces:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@b4ffde65f46336ab88eb53be0f8ed68aafcccdf0  # v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@82c7e631bb3cdc910f68e0410993404601b3ef26  # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: .github/requirements-ci.txt
    - name: Install dependencies
      run: |
        python -m pip install -r .github/requirements-ci.txt

    - name: Check prompts.csv presence
      id: prompts_csv
      run: |
        if [ -f prompts.csv ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "prompts.csv not found. Skipping CSV lint checks."
        fi

    - name: Run csvclean on prompts.csv
      if: steps.prompts_csv.outputs.exists == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Capture csvclean exit code while preserving error output for debugging
        exit_code=0
        csvclean --length-mismatch --empty-columns -u 2 prompts.csv > /tmp/prompts_clean.csv 2> csvclean_errors.log || exit_code=$?
        # Report errors and fail if csvclean found issues or exited nonzero
        if [ -s csvclean_errors.log ] || [ "$exit_code" -ne 0 ]; then
          [ -s csvclean_errors.log ] && cat csvclean_errors.log
          exit 1
        fi
    - name: Check newline at EOF
      if: steps.prompts_csv.outputs.exists == 'true'
      run: |
        last_byte=$(tail -c1 prompts.csv | od -An -t x1)
        if [ "$last_byte" != " 0a" ]; then
          echo "prompts.csv does not end with newline"
        else
          echo "prompts.csv ends with newline"
        fi
    - name: Check Trailing Whitespaces
      if: steps.prompts_csv.outputs.exists == 'true'
      run: |
        # Check if the special file contains any trailing whitespaces
        if grep -q "[[:space:]]$" ./prompts.csv; then
          echo "ERROR: Found trailing whitespaces in prompts.csv"
          exit 1
        else
          echo "No trailing whitespaces found in prompts.csv"
        fi
